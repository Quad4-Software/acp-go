[project]
site_name = "acp-go"
site_url = "https://quad4-software.github.io/acp-go/"
site_description = "Agent Client Protocol v1 library for Go"
site_author = "Quad4 Software"
docs_dir = "docs"
site_dir = "site"

copyright = "Copyright &copy; 2026 Quad4 Software. 0BSD licensed."

repo_url = "https://github.com/Quad4-Software/acp-go"
repo_name = "Quad4-Software/acp-go"
edit_uri = "edit/master/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { Guides = [
    { "Writing an agent" = "guides/agent.md" },
    { "Writing a client" = "guides/client.md" },
    { "Transports" = "guides/transports.md" },
    { "Extending the protocol" = "guides/extending.md" },
  ]},
  { Protocol = [
    { "Wire format" = "protocol/wire-format.md" },
    { "Tagged unions" = "protocol/unions.md" },
    { "Errors" = "protocol/errors.md" },
  ]},
  { "Development" = "development.md" },
  { "API reference" = "https://pkg.go.dev/github.com/Quad4-Software/acp-go" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "slate"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Quad4-Software/acp-go"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
